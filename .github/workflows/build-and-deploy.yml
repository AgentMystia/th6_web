name: Build WASM & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61

      - name: Download DAT assets from Release
        run: |
          for f in th06_IN.DAT th06_ST.DAT th06_ED.DAT th06_CM.DAT th06_TL.DAT th06_MD.DAT; do
            curl -sL "https://github.com/${{ github.repository }}/releases/download/game-assets/$f" -o "$f"
          done
          ls -lh *.DAT

      - name: Configure
        run: emcmake cmake -S . -B build/cmake

      - name: Build (compile objects)
        run: cmake --build build/cmake -j$(nproc)

      - name: Re-link with embedded DATs
        run: |
          cd build/cmake
          cp ../../th06_*.DAT .
          emcc @CMakeFiles/th06.dir/objects1.rsp -o th06.js \
            -sUSE_WEBGL2=1 -sFULL_ES3=1 -sUSE_LIBPNG=1 -sUSE_LIBJPEG=1 \
            -sALLOW_MEMORY_GROWTH=1 -sFORCE_FILESYSTEM=1 \
            "-sEXPORTED_FUNCTIONS=_main,_th06_init,_th06_run,_th06_key_state_ptr" \
            "-sEXPORTED_RUNTIME_METHODS=ccall,cwrap,FS,HEAPU8,HEAP16,HEAPU16" \
            --embed-file th06_IN.DAT --embed-file th06_ST.DAT \
            --embed-file th06_ED.DAT --embed-file th06_CM.DAT \
            --embed-file th06_TL.DAT --embed-file th06_MD.DAT
          ls -lh th06.js th06.wasm

      - name: Prepare site
        run: |
          mkdir -p _site/assets/audio
          cp src/web/index.html _site/
          cp build/cmake/th06.js _site/
          cp build/cmake/th06.wasm _site/
          cp assets/audio/*.ogg _site/assets/audio/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
